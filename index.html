<style>

<body>

<div id="loginScreen">

    <div class="login-box">

        <h1>💬 우리 단체 채팅</h1>

        <p>닉네임을 입력하세요.</p>

        <input
            id="nickname"
            maxlength="20"
            placeholder="닉네임"
        >

        <button id="enter">
            채팅방 입장

    </div>

</div>


<div id="chatScreen" class="hidden">

    <div class="chat">

        <div class="header">

            <div class="title">
                💬 우리 단체 채팅
            </div>

            <div
                class="user"
                id="currentUser"
            ></div>

        </div>

        <div
            class="status"
            id="status"
        >
            연결 중...
        </div>

        <div
            class="messages"
            id="messages"
        ></div>

        <div class="input-area">

            <input
                id="message"
                maxlength="500"
                placeholder="메시지를 입력하세요..."
            >

            <button id="send">
                전송
            </button>

        </div>

    </div>

</div>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================
   ⭐⭐⭐ 여기에 네 Supabase 정보를 넣어
   ========================================= */

const SUPABASE_URL =
    "https://supabase.com/dashboard/project/stcheedsroustirtizoq/sql/9e71d531-7966-4568-a3dd-d24dde9c23f8";

const SUPABASE_KEY =
    "sb_publishable_-VQA1TKCJul4NZFBXnPNPA_aTimwwMJ";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let nickname = "";


/* HTML 요소 */

const loginScreen =
    document.getElementById("loginScreen");

const chatScreen =
    document.getElementById("chatScreen");

const nicknameInput =
    document.getElementById("nickname");

const messageInput =
    document.getElementById("message");

const messages =
    document.getElementById("messages");

const status =
    document.getElementById("status");


/* =========================================
   채팅 입장
   ========================================= */

document
    .getElementById("enter")
    .onclick = enterChat;


function enterChat() {

    nickname =
        nicknameInput.value.trim();

    if (!nickname) {

        alert("닉네임을 입력하세요.");

        return;
    }

    loginScreen
        .classList
        .add("hidden");

    chatScreen
        .classList
        .remove("hidden");

    document
        .getElementById("currentUser")
        .textContent =
        "@" + nickname;

    loadMessages();

    realtime();

    messageInput.focus();
}


/* =========================================
   기존 메시지 가져오기
   ========================================= */

async function loadMessages() {

    const result =
        await supabaseClient
            .from("messages")
            .select("*")
            .order("created_at", {
                ascending: true
            })
            .limit(100);

    if (result.error) {

        console.error(result.error);

        status.textContent =
            "연결 오류";

        return;
    }

    messages.innerHTML = "";

    result.data.forEach(
        showMessage
    );

    scrollBottom();
}


/* =========================================
   실시간 메시지
   ========================================= */

function realtime() {

    supabaseClient
        .channel("chat-room")
        .on(
            "postgres_changes",
            {
                event: "INSERT",
                schema: "public",
                table: "messages"
            },
            function(payload) {

                showMessage(
                    payload.new
                );

                scrollBottom();
            }
        )
        .subscribe(
            function(connection) {

                if (
                    connection ===
                    "SUBSCRIBED"
                ) {

                    status.textContent =
                        "● 실시간 연결됨";
                }
            }
        );
}


/* =========================================
   화면에 메시지 표시
   ========================================= */

function showMessage(data) {

    const box =
        document.createElement("div");

    box.className = "message";

    if (
        data.nickname === nickname
    ) {

        box.classList.add("mine");
    }

    const name =
        document.createElement("div");

    name.className = "name";

    name.textContent =
        data.nickname;


    const bubble =
        document.createElement("div");

    bubble.className = "bubble";

    bubble.textContent =
        data.message;


    box.appendChild(name);

    box.appendChild(bubble);

    messages.appendChild(box);
}


/* =========================================
   메시지 보내기
   ========================================= */

async function sendMessage() {

    const text =
        messageInput.value.trim();

    if (!text) {
        return;
    }

    const result =
        await supabaseClient
            .from("messages")
            .insert({
                nickname: nickname,
                message: text
            });

    if (result.error) {

        console.error(result.error);

        alert(
            "메시지를 보내지 못했습니다."
        );

        return;
    }

    messageInput.value = "";

    messageInput.focus();
}


/* =========================================
   전송 버튼
   ========================================= */

document
    .getElementById("send")
    .onclick = sendMessage;


/* Enter로 전송 */

messageInput
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                sendMessage();
            }
        }
    );


/* 스크롤 */

function scrollBottom() {

    messages.scrollTop =
        messages.scrollHeight;
}

</script>

</body>
</html>
